<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Carioca" />
  <meta name="theme-color" content="#0d1117" />
  <title>Português Carioca</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #0d1117; font-family: Georgia, 'Times New Roman', serif; overscroll-behavior: none; }
    input { -webkit-appearance: none; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const VERBS = [
      { pt: "Ir", fr: "Aller", conjugations: [{ pro: "Eu", pt: "vou", fr: "je vais" }, { pro: "Você", pt: "vai", fr: "tu vas" }, { pro: "A gente", pt: "vai", fr: "on va" }, { pro: "Nós", pt: "vamos", fr: "nous allons" }], example: "Eu vou à praia.", exampleFr: "Je vais à la plage." },
      { pt: "Estar", fr: "Être (état)", conjugations: [{ pro: "Eu", pt: "estou", fr: "je suis" }, { pro: "Você", pt: "está", fr: "tu es" }, { pro: "A gente", pt: "tá", fr: "on est" }, { pro: "Nós", pt: "estamos", fr: "nous sommes" }], example: "Eu tô de boa.", exampleFr: "Je suis tranquille." },
      { pt: "Fazer", fr: "Faire", conjugations: [{ pro: "Eu", pt: "faço", fr: "je fais" }, { pro: "Você", pt: "faz", fr: "tu fais" }, { pro: "A gente", pt: "faz", fr: "on fait" }, { pro: "Nós", pt: "fazemos", fr: "nous faisons" }], example: "Que você faz?", exampleFr: "Qu'est-ce que tu fais ?" },
      { pt: "Achar", fr: "Penser / Trouver", conjugations: [{ pro: "Eu", pt: "acho", fr: "je pense" }, { pro: "Você", pt: "acha", fr: "tu penses" }, { pro: "A gente", pt: "acha", fr: "on pense" }, { pro: "Nós", pt: "achamos", fr: "nous pensons" }], example: "Eu acho que sim.", exampleFr: "Je pense que oui." },
      { pt: "Gostar", fr: "Aimer", conjugations: [{ pro: "Eu", pt: "gosto", fr: "j'aime" }, { pro: "Você", pt: "gosta", fr: "tu aimes" }, { pro: "A gente", pt: "gosta", fr: "on aime" }, { pro: "Nós", pt: "gostamos", fr: "nous aimons" }], example: "Eu gosto de samba.", exampleFr: "J'aime le samba." },
      { pt: "Falar", fr: "Parler", conjugations: [{ pro: "Eu", pt: "falo", fr: "je parle" }, { pro: "Você", pt: "fala", fr: "tu parles" }, { pro: "A gente", pt: "fala", fr: "on parle" }, { pro: "Nós", pt: "falamos", fr: "nous parlons" }], example: "Eu falo português.", exampleFr: "Je parle portugais." },
      { pt: "Querer", fr: "Vouloir", conjugations: [{ pro: "Eu", pt: "quero", fr: "je veux" }, { pro: "Você", pt: "quer", fr: "tu veux" }, { pro: "A gente", pt: "quer", fr: "on veut" }, { pro: "Nós", pt: "queremos", fr: "nous voulons" }], example: "Eu quero uma cerveja.", exampleFr: "Je veux une bière." },
      { pt: "Ter", fr: "Avoir", conjugations: [{ pro: "Eu", pt: "tenho", fr: "j'ai" }, { pro: "Você", pt: "tem", fr: "tu as" }, { pro: "A gente", pt: "tem", fr: "on a" }, { pro: "Nós", pt: "temos", fr: "nous avons" }], example: "Eu tenho fome.", exampleFr: "J'ai faim." },
      { pt: "Poder", fr: "Pouvoir", conjugations: [{ pro: "Eu", pt: "posso", fr: "je peux" }, { pro: "Você", pt: "pode", fr: "tu peux" }, { pro: "A gente", pt: "pode", fr: "on peut" }, { pro: "Nós", pt: "podemos", fr: "nous pouvons" }], example: "Posso te ajudar?", exampleFr: "Je peux t'aider ?" },
      { pt: "Vir", fr: "Venir", conjugations: [{ pro: "Eu", pt: "venho", fr: "je viens" }, { pro: "Você", pt: "vem", fr: "tu viens" }, { pro: "A gente", pt: "vem", fr: "on vient" }, { pro: "Nós", pt: "vimos", fr: "nous venons" }], example: "Você vem à festa?", exampleFr: "Tu viens à la fête ?" },
    ];

    const EXPRESSIONS = [
      { pt: "E aí?", fr: "Ça va ? / Quoi de neuf ?", context: "Salutation informelle carioca" },
      { pt: "Que legal!", fr: "C'est cool ! / Super !", context: "Exprimer enthousiasme" },
      { pt: "Tá de boa", fr: "C'est tranquille / Ça va bien", context: "Réponse relaxée" },
      { pt: "Vamo indo", fr: "Allons-y / On y va", context: "Pour se mettre en route" },
      { pt: "Tá ligado?", fr: "Tu comprends ? / T'es au courant ?", context: "Vérifier compréhension" },
      { pt: "Mó legal", fr: "Vraiment cool / Trop bien", context: "Enthousiasme amplifié" },
      { pt: "Não tô nem aí", fr: "Je m'en fiche / Je m'en fous", context: "Exprimer indifférence" },
      { pt: "Bora!", fr: "Allez ! / On y va !", context: "Incitation à partir ou commencer" },
      { pt: "Cara!", fr: "Mec ! / Mon vieux !", context: "Interpellation familière" },
      { pt: "Saudade", fr: "Nostalgie / Manque affectif", context: "Sentiment unique brésilien" },
    ];

    const VOCAB = [
      { pt: "Padaria", fr: "Boulangerie", emoji: "🥖" },
      { pt: "Mercado", fr: "Marché / Supermarché", emoji: "🛒" },
      { pt: "Praia", fr: "Plage", emoji: "🏖️" },
      { pt: "Ônibus", fr: "Bus", emoji: "🚌" },
      { pt: "Chuva", fr: "Pluie", emoji: "🌧️" },
      { pt: "Quente", fr: "Chaud", emoji: "☀️" },
      { pt: "Frio", fr: "Froid", emoji: "❄️" },
      { pt: "Táxi", fr: "Taxi", emoji: "🚕" },
      { pt: "Farmácia", fr: "Pharmacie", emoji: "💊" },
      { pt: "Açougue", fr: "Boucherie", emoji: "🥩" },
    ];

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

    function generateQuizQuestions() {
      const questions = [];
      VERBS.forEach(v => {
        questions.push({ question: `Comment dit-on "${v.fr}" en portugais ?`, correct: v.pt, type: "verb", options: shuffle([v.pt, ...VERBS.filter(x => x.pt !== v.pt).slice(0,3).map(x => x.pt)]) });
      });
      EXPRESSIONS.forEach(e => {
        questions.push({ question: `Que signifie "${e.pt}" ?`, correct: e.fr, type: "expression", options: shuffle([e.fr, ...EXPRESSIONS.filter(x => x.pt !== e.pt).slice(0,3).map(x => x.fr)]) });
      });
      return shuffle(questions).slice(0, 20);
    }

    const TABS = ["Verbes", "Expressions", "Vocabulaire", "Quiz", "Stats"];
    const TAB_ICONS = ["📚", "💬", "🗝️", "🎯", "📊"];

    function SectionTitle({ children }) {
      return <div style={{ fontSize: 11, color: "#6b8f6b", letterSpacing: 2, textTransform: "uppercase", marginBottom: 14, paddingBottom: 8, borderBottom: "1px solid #1e2e1e" }}>{children}</div>;
    }

    function App() {
      const [activeTab, setActiveTab] = useState(0);
      const [expandedVerb, setExpandedVerb] = useState(null);
      const [quizQuestions, setQuizQuestions] = useState([]);
      const [quizIndex, setQuizIndex] = useState(0);
      const [quizSelected, setQuizSelected] = useState(null);
      const [quizMode, setQuizMode] = useState("mcq");
      const [writeAnswer, setWriteAnswer] = useState("");
      const [quizResults, setQuizResults] = useState([]);
      const [quizDone, setQuizDone] = useState(false);
      const [showAnswer, setShowAnswer] = useState(false);
      const [stats, setStats] = useState(() => {
        try { return JSON.parse(localStorage.getItem("carioca_stats")) || { completed: 0, correct: 0, streak: 3, wordsLearned: 30 }; }
        catch { return { completed: 0, correct: 0, streak: 3, wordsLearned: 30 }; }
      });

      useEffect(() => { setQuizQuestions(generateQuizQuestions()); }, []);
      useEffect(() => { try { localStorage.setItem("carioca_stats", JSON.stringify(stats)); } catch {} }, [stats]);

      const handleAnswer = useCallback((answer) => {
        const q = quizQuestions[quizIndex];
        const isCorrect = answer.trim().toLowerCase() === q.correct.trim().toLowerCase();
        setQuizSelected(answer);
        setShowAnswer(true);
        setTimeout(() => {
          const newResults = [...quizResults, isCorrect];
          setQuizResults(newResults);
          if (quizIndex + 1 >= quizQuestions.length) {
            const correct = newResults.filter(Boolean).length;
            setStats(s => ({ ...s, completed: s.completed + 1, correct: s.correct + correct, wordsLearned: s.wordsLearned + Math.floor(correct / 2) }));
            setQuizDone(true);
          } else {
            setQuizIndex(i => i + 1);
            setQuizSelected(null);
            setWriteAnswer("");
            setShowAnswer(false);
          }
        }, 1200);
      }, [quizIndex, quizQuestions, quizResults]);

      const restartQuiz = () => {
        setQuizQuestions(generateQuizQuestions());
        setQuizIndex(0); setQuizSelected(null); setWriteAnswer("");
        setQuizResults([]); setQuizDone(false); setShowAnswer(false);
      };

      return (
        <div style={{ fontFamily: "Georgia, 'Times New Roman', serif", minHeight: "100vh", minHeight: "-webkit-fill-available", background: "#0d1117", color: "#e8d5b0", display: "flex", flexDirection: "column", maxWidth: 480, margin: "0 auto", position: "relative" }}>
          {/* Header */}
          <div style={{ background: "linear-gradient(135deg, #1a2a1a 0%, #0d1117 100%)", borderBottom: "1px solid #2a3a2a", padding: "env(safe-area-inset-top, 20px) 20px 16px", paddingTop: "max(env(safe-area-inset-top), 20px)", position: "sticky", top: 0, zIndex: 10 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 28 }}>🇧🇷</span>
              <div>
                <div style={{ fontSize: 18, fontWeight: "bold", color: "#f5d97e", letterSpacing: 1 }}>Português Carioca</div>
                <div style={{ fontSize: 10, color: "#6b8f6b", letterSpacing: 2, textTransform: "uppercase" }}>Olá, Master Naphan! 🌴</div>
              </div>
              <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6, background: "#1a2a1a", border: "1px solid #2d4a2d", borderRadius: 20, padding: "4px 12px" }}>
                <span style={{ fontSize: 14 }}>🔥</span>
                <span style={{ color: "#f5d97e", fontWeight: "bold", fontSize: 14 }}>{stats.streak} jours</span>
              </div>
            </div>
          </div>

          {/* Content */}
          <div style={{ flex: 1, overflowY: "auto", padding: "0 0 90px", WebkitOverflowScrolling: "touch" }}>

            {/* VERBES */}
            {activeTab === 0 && (
              <div style={{ padding: 16 }}>
                <SectionTitle>10 Verbes Essentiels</SectionTitle>
                {VERBS.map((v, i) => (
                  <div key={i} onClick={() => setExpandedVerb(expandedVerb === i ? null : i)}
                    style={{ background: expandedVerb === i ? "#1a2f1a" : "#111b11", border: `1px solid ${expandedVerb === i ? "#3a6a3a" : "#1e2e1e"}`, borderRadius: 12, marginBottom: 10, cursor: "pointer", overflow: "hidden" }}>
                    <div style={{ padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div>
                        <span style={{ fontSize: 18, fontWeight: "bold", color: "#f5d97e" }}>{v.pt}</span>
                        <span style={{ fontSize: 13, color: "#7aaf7a", marginLeft: 10 }}>{v.fr}</span>
                      </div>
                      <span style={{ color: "#3a6a3a", fontSize: 16 }}>{expandedVerb === i ? "▲" : "▼"}</span>
                    </div>
                    {expandedVerb === i && (
                      <div style={{ borderTop: "1px solid #2a3a2a", padding: "12px 16px" }}>
                        <div style={{ marginBottom: 10 }}>
                          {v.conjugations.map((c, j) => (
                            <div key={j} style={{ display: "flex", gap: 8, marginBottom: 4, alignItems: "baseline" }}>
                              <span style={{ color: "#6b8f6b", fontSize: 12, minWidth: 70 }}>{c.pro}</span>
                              <span style={{ color: "#f5d97e", fontWeight: "bold" }}>{c.pt}</span>
                              <span style={{ color: "#888", fontSize: 12 }}>— {c.fr}</span>
                            </div>
                          ))}
                        </div>
                        <div style={{ background: "#0d1a0d", borderRadius: 8, padding: "8px 12px", borderLeft: "3px solid #3a6a3a" }}>
                          <div style={{ color: "#c8e8a0", fontSize: 14, fontStyle: "italic" }}>{v.example}</div>
                          <div style={{ color: "#888", fontSize: 12, marginTop: 2 }}>{v.exampleFr}</div>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {/* EXPRESSIONS */}
            {activeTab === 1 && (
              <div style={{ padding: 16 }}>
                <SectionTitle>10 Expressions Cariocas 🌊</SectionTitle>
                {EXPRESSIONS.map((e, i) => (
                  <div key={i} style={{ background: "#111b11", border: "1px solid #1e2e1e", borderRadius: 12, marginBottom: 10, padding: "14px 16px" }}>
                    <div style={{ fontSize: 20, color: "#f5d97e", fontWeight: "bold", marginBottom: 4 }}>{e.pt}</div>
                    <div style={{ fontSize: 15, color: "#c8e8a0", marginBottom: 4 }}>🇫🇷 {e.fr}</div>
                    <div style={{ fontSize: 12, color: "#6b8f6b", fontStyle: "italic" }}>💡 {e.context}</div>
                  </div>
                ))}
              </div>
            )}

            {/* VOCAB */}
            {activeTab === 2 && (
              <div style={{ padding: 16 }}>
                <SectionTitle>Vocabulaire du Quotidien</SectionTitle>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  {VOCAB.map((w, i) => (
                    <div key={i} style={{ background: "#111b11", border: "1px solid #1e2e1e", borderRadius: 12, padding: "16px 14px", textAlign: "center" }}>
                      <div style={{ fontSize: 32, marginBottom: 6 }}>{w.emoji}</div>
                      <div style={{ fontSize: 17, color: "#f5d97e", fontWeight: "bold" }}>{w.pt}</div>
                      <div style={{ fontSize: 12, color: "#7aaf7a", marginTop: 2 }}>{w.fr}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* QUIZ */}
            {activeTab === 3 && (
              <div style={{ padding: 16 }}>
                <SectionTitle>Quiz Interactif 🎯</SectionTitle>
                {!quizDone ? (
                  quizQuestions.length > 0 ? (
                    <div>
                      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
                        {["mcq", "write"].map(m => (
                          <button key={m} onClick={() => { setQuizMode(m); setQuizSelected(null); setWriteAnswer(""); setShowAnswer(false); }}
                            style={{ flex: 1, padding: "8px", borderRadius: 8, border: `1px solid ${quizMode === m ? "#3a6a3a" : "#1e2e1e"}`, background: quizMode === m ? "#1a3a1a" : "#111b11", color: quizMode === m ? "#f5d97e" : "#6b8f6b", cursor: "pointer", fontSize: 13, fontFamily: "Georgia, serif" }}>
                            {m === "mcq" ? "✅ Choix multiple" : "✏️ Réponse écrite"}
                          </button>
                        ))}
                      </div>
                      <div style={{ marginBottom: 14 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#6b8f6b", marginBottom: 4 }}>
                          <span>Question {quizIndex + 1}/{quizQuestions.length}</span>
                          <span>✓ {quizResults.filter(Boolean).length} correct</span>
                        </div>
                        <div style={{ height: 4, background: "#1e2e1e", borderRadius: 4 }}>
                          <div style={{ height: "100%", background: "linear-gradient(90deg, #3a6a3a, #7adf7a)", borderRadius: 4, width: `${(quizIndex / quizQuestions.length) * 100}%`, transition: "width 0.3s" }} />
                        </div>
                      </div>
                      <div style={{ background: "#1a2a1a", border: "1px solid #2a4a2a", borderRadius: 14, padding: "20px 16px", marginBottom: 16, textAlign: "center" }}>
                        <div style={{ fontSize: 11, color: "#6b8f6b", textTransform: "uppercase", letterSpacing: 2, marginBottom: 8 }}>
                          {quizQuestions[quizIndex]?.type === "verb" ? "Verbe" : "Expression"}
                        </div>
                        <div style={{ fontSize: 17, color: "#e8d5b0", lineHeight: 1.4 }}>{quizQuestions[quizIndex]?.question}</div>
                      </div>
                      {quizMode === "mcq" ? (
                        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                          {quizQuestions[quizIndex]?.options.map((opt, i) => {
                            const isCorrect = opt === quizQuestions[quizIndex].correct;
                            const isSelected = quizSelected === opt;
                            let bg = "#111b11", border = "#1e2e1e", color = "#e8d5b0";
                            if (showAnswer && isCorrect) { bg = "#1a3a1a"; border = "#3a8a3a"; color = "#7adf7a"; }
                            else if (showAnswer && isSelected && !isCorrect) { bg = "#3a1a1a"; border = "#8a3a3a"; color = "#df7a7a"; }
                            return (
                              <button key={i} onClick={() => !showAnswer && handleAnswer(opt)}
                                style={{ background: bg, border: `1px solid ${border}`, borderRadius: 10, padding: "13px 16px", color, fontSize: 14, cursor: "pointer", textAlign: "left", fontFamily: "Georgia, serif" }}>
                                {opt}
                              </button>
                            );
                          })}
                        </div>
                      ) : (
                        <div>
                          <input value={writeAnswer} onChange={e => setWriteAnswer(e.target.value)}
                            placeholder="Écris ta réponse..."
                            style={{ width: "100%", background: "#111b11", border: "1px solid #2a3a2a", borderRadius: 10, padding: "13px 16px", color: "#e8d5b0", fontSize: 15, outline: "none", boxSizing: "border-box", marginBottom: 10, fontFamily: "Georgia, serif" }}
                            onKeyDown={e => e.key === "Enter" && writeAnswer && !showAnswer && handleAnswer(writeAnswer)} />
                          <button onClick={() => writeAnswer && !showAnswer && handleAnswer(writeAnswer)}
                            style={{ width: "100%", background: "#1a3a1a", border: "1px solid #3a6a3a", borderRadius: 10, padding: "13px", color: "#7adf7a", fontSize: 15, cursor: "pointer", fontFamily: "Georgia, serif" }}>
                            Valider →
                          </button>
                          {showAnswer && (
                            <div style={{ marginTop: 10, padding: "10px 14px", background: "#1a2a1a", borderRadius: 10, color: "#c8e8a0", fontSize: 14 }}>
                              Réponse correcte : <strong>{quizQuestions[quizIndex]?.correct}</strong>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  ) : <div style={{ textAlign: "center", padding: 40, color: "#6b8f6b" }}>Chargement...</div>
                ) : (
                  <div style={{ textAlign: "center", padding: "30px 16px" }}>
                    <div style={{ fontSize: 60, marginBottom: 16 }}>{quizResults.filter(Boolean).length >= 15 ? "🏆" : quizResults.filter(Boolean).length >= 10 ? "🎉" : "💪"}</div>
                    <div style={{ fontSize: 26, color: "#f5d97e", fontWeight: "bold", marginBottom: 8 }}>{quizResults.filter(Boolean).length}/{quizQuestions.length}</div>
                    <div style={{ fontSize: 15, color: "#7aaf7a", marginBottom: 24 }}>
                      {quizResults.filter(Boolean).length >= 15 ? "Excelente, Master!" : quizResults.filter(Boolean).length >= 10 ? "Muito bom!" : "Continue assim!"}
                    </div>
                    <button onClick={restartQuiz}
                      style={{ background: "#1a3a1a", border: "1px solid #3a6a3a", borderRadius: 12, padding: "14px 32px", color: "#7adf7a", fontSize: 16, cursor: "pointer", fontFamily: "Georgia, serif" }}>
                      🔄 Nouveau Quiz
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* STATS */}
            {activeTab === 4 && (
              <div style={{ padding: 16 }}>
                <SectionTitle>Mes Statistiques 📊</SectionTitle>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
                  {[
                    { label: "Quiz complétés", value: stats.completed, icon: "✅" },
                    { label: "Taux de réussite", value: `${stats.completed > 0 ? Math.round((stats.correct / (stats.completed * 20)) * 100) : 0}%`, icon: "🎯" },
                    { label: "Jours consécutifs", value: stats.streak, icon: "🔥" },
                    { label: "Mots appris", value: stats.wordsLearned, icon: "🗝️" },
                  ].map((s, i) => (
                    <div key={i} style={{ background: "#111b11", border: "1px solid #1e2e1e", borderRadius: 14, padding: "18px 14px", textAlign: "center" }}>
                      <div style={{ fontSize: 28, marginBottom: 6 }}>{s.icon}</div>
                      <div style={{ fontSize: 26, fontWeight: "bold", color: "#f5d97e" }}>{s.value}</div>
                      <div style={{ fontSize: 11, color: "#6b8f6b", marginTop: 4 }}>{s.label}</div>
                    </div>
                  ))}
                </div>
                <div style={{ background: "#111b11", border: "1px solid #1e2e1e", borderRadius: 14, padding: 16, marginBottom: 12 }}>
                  <div style={{ fontSize: 11, color: "#6b8f6b", letterSpacing: 2, marginBottom: 10 }}>RAPPELS QUOTIDIENS 🔔</div>
                  {[{ time: "8h00", label: "Session matin", dur: "30 min", icon: "🌅" }, { time: "20h00", label: "Session soir", dur: "15 min", icon: "🌙" }].map((r, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderBottom: i === 0 ? "1px solid #1e2e1e" : "none" }}>
                      <span style={{ fontSize: 22 }}>{r.icon}</span>
                      <div style={{ flex: 1 }}>
                        <div style={{ color: "#f5d97e", fontWeight: "bold", fontSize: 14 }}>{r.time} — {r.label}</div>
                        <div style={{ fontSize: 12, color: "#7aaf7a" }}>Durée : {r.dur} · "Bora aprender, Master!" 💪</div>
                      </div>
                      <div style={{ width: 10, height: 10, borderRadius: "50%", background: "#3a8a3a" }} />
                    </div>
                  ))}
                </div>
                <div style={{ background: "#1a2a1a", border: "1px solid #2a4a2a", borderRadius: 14, padding: 16, textAlign: "center" }}>
                  <div style={{ fontSize: 13, color: "#c8e8a0", marginBottom: 10 }}>Contenu total disponible</div>
                  <div style={{ display: "flex", justifyContent: "center", gap: 20 }}>
                    {[{ n: 10, l: "Verbes" }, { n: 10, l: "Expressions" }, { n: 10, l: "Vocab" }, { n: 20, l: "Questions" }].map((item, i) => (
                      <div key={i} style={{ textAlign: "center" }}>
                        <div style={{ fontSize: 22, color: "#f5d97e", fontWeight: "bold" }}>{item.n}</div>
                        <div style={{ fontSize: 11, color: "#6b8f6b" }}>{item.l}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Bottom Nav */}
          <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 480, background: "#0d1117", borderTop: "1px solid #1e2e1e", display: "flex", paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
            {TABS.map((tab, i) => (
              <button key={i} onClick={() => setActiveTab(i)}
                style={{ flex: 1, padding: "10px 4px 12px", border: "none", background: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                <span style={{ fontSize: 20 }}>{TAB_ICONS[i]}</span>
                <span style={{ fontSize: 9, color: activeTab === i ? "#f5d97e" : "#3a5a3a", fontFamily: "sans-serif", letterSpacing: 0.5 }}>{tab}</span>
                {activeTab === i && <div style={{ width: 20, height: 2, background: "#f5d97e", borderRadius: 2 }} />}
              </button>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
